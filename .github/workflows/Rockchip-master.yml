name: Rockchip-master
run-name: Build - ${{ inputs.REPO_NAME }} - ${{ inputs.REPO_BRANCH }}

on:
  workflow_dispatch:
    inputs:
      REPO_NAME:
        description: "仓库地址"
        required: true
        type: choice
        default: "immortalWrt官方源码"
        options:
          - "immortalWrt官方源码"
          - "OpenWrt官方源码"
      REPO_BRANCH:
        description: "分支"
        required: true
        type: choice
        default: "master"
        options:
          - "master"
          - "openwrt-25.12"
          

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  CONFIG_FILE: config/Rockchip.config
  DIY_SCRIPT: scripts/diy.sh
  CACHE_TOOLCHAIN: true
  FIRMWARE_RELEASE: true
  FIRMWARE_TAG: Rockchip-openwrt-master
  TZ: Asia/Shanghai

jobs:
  Build:
    runs-on: ubuntu-24.04

    steps:
      - name: 设置仓库参数
        run: |
          if [ "${{ inputs.REPO_NAME }}" = "immortalWrt官方源码" ]; then
            REPO_URL="https://github.com/immortalwrt/immortalwrt"
            REPO_ID="immortalwrt"
            REPO_BRANCH="${{ inputs.REPO_BRANCH }}"
          else
            REPO_URL="https://github.com/openwrt/openwrt"
            REPO_ID="openwrt"
            CONFIG_FILE=config/Rockchip-openwrt.config
            echo "CONFIG_FILE=$CONFIG_FILE" >> $GITHUB_ENV
              if [ "${{ inputs.REPO_BRANCH }}" = "master" ]; then
                  REPO_BRANCH="main"
              else
                REPO_BRANCH="${{ inputs.REPO_BRANCH }}"
              fi
          fi

          echo "REPO_URL=$REPO_URL" >> $GITHUB_ENV
          echo "REPO_BRANCH=$REPO_BRANCH" >> $GITHUB_ENV
          echo "FIRMWARE_TAG=${REPO_ID}-$REPO_BRANCH" >> $GITHUB_ENV

          echo "仓库地址：$REPO_URL"
          echo "分支：$REPO_BRANCH"
          echo "固件标签：${REPO_ID}-$REPO_BRANCH"
          echo "配置文件：$CONFIG_FILE"

      - name: 检查服务器性能
        run: |
          echo "警告⚠"
          echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
          echo -e "已知CPU型号(降序): 7763，8370C，8272CL，8171M，E5-2673\n"
          echo "--------------------------CPU信息--------------------------"
          echo "CPU物理数量: $(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
          echo "CPU核心数量: $(nproc)"
          echo -e "CPU型号信息:$(cat /proc/cpuinfo | grep -m1 name | awk -F: '{print $2}')\n"
          echo "--------------------------内存信息--------------------------"
          echo "已安装内存详细信息:"
          echo -e "$(sudo lshw -short -C memory | grep GiB)\n"
          echo "--------------------------硬盘信息--------------------------"
          echo "硬盘数量: $(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT

      - name: 初始化环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi -f $(docker images -q) 2>/dev/null || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android $AGENT_TOOLSDIRECTORY
          sudo swapoff -a && sudo rm -f /swapfile /mnt/swapfile
          sudo -E apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo -E apt-get -y update
          sudo -E apt-get -y install $(curl -fsSL https://ophub.org/ubuntu2404-make-openwrt-depends)
          sudo -E systemctl daemon-reload
          sudo -E apt-get -y autoremove --purge
          sudo -E apt-get -y clean
          sudo timedatectl set-timezone "$TZ"

      - name: 合并磁盘
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 1024
          temp-reserve-mb: 100
          root-reserve-mb: 1024

      - name: 结帐
        uses: actions/checkout@main

      - name: 克隆源代码
        run: |
          df -hT $GITHUB_WORKSPACE
          git clone $REPO_URL -b $REPO_BRANCH openwrt
          cd openwrt
          echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV
          if [ "${{ inputs.REPO_NAME }}" = "OpenWrt官方源码" ]; then
            echo "curl -fsSL -o ./feeds.conf.default https://raw.githubusercontent.com/immortalwrt/immortalwrt/refs/heads/${{ inputs.REPO_BRANCH }}/feeds.conf.default"
            curl -fsSL -o ./feeds.conf.default https://raw.githubusercontent.com/immortalwrt/immortalwrt/refs/heads/${{ inputs.REPO_BRANCH }}/feeds.conf.default
          fi
          COMMIT_AUTHOR=$(git show -s --date=short --format="作者: %an")
          echo "COMMIT_AUTHOR=$COMMIT_AUTHOR" >> $GITHUB_ENV
          COMMIT_DATE=$(git show -s --date=short --format="时间: %ci")
          echo "COMMIT_DATE=$COMMIT_DATE" >> $GITHUB_ENV
          COMMIT_MESSAGE=$(git show -s --date=short --format="内容: %s")
          echo "COMMIT_MESSAGE=$COMMIT_MESSAGE" >> $GITHUB_ENV
          COMMIT_HASH=$(git show -s --date=short --format="hash: %H")
          echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_ENV

      - name: 安装 Feeds
        run: |
          cd $OPENWRT_PATH
          ./scripts/feeds update -a
          # 修改samba4菜单路径
          sed -i 's/nas/services/g' feeds/luci/applications/luci-app-samba4/root/usr/share/luci/menu.d/luci-app-samba4.json
          ./scripts/feeds install -a

      - name: 生成变量
        run: |
          cp $CONFIG_FILE $OPENWRT_PATH/.config
          cd $OPENWRT_PATH
          make defconfig > /dev/null 2>&1
          SOURCE_REPO="$(echo $REPO_URL | awk -F '/' '{print $(NF)}')"
          echo "SOURCE_REPO=$SOURCE_REPO" >> $GITHUB_ENV
          DEVICE_TARGET=$(cat .config | grep CONFIG_TARGET_BOARD | awk -F '"' '{print $2}')
          echo "DEVICE_TARGET=$DEVICE_TARGET" >> $GITHUB_ENV
          DEVICE_SUBTARGET=$(cat .config | grep CONFIG_TARGET_SUBTARGET | awk -F '"' '{print $2}')
          echo "DEVICE_SUBTARGET=$DEVICE_SUBTARGET" >> $GITHUB_ENV

      - name: 缓存工具链
        if: env.CACHE_TOOLCHAIN == 'true'
        uses: HiGarfield/cachewrtbuild@main
        with:
          ccache: false
          mixkey: ${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}
          prefix: ${{ env.OPENWRT_PATH }}

      - name: 加载自定义配置
        run: |
          ## [ -e files ] && mv files $OPENWRT_PATH/files
          ## [ -e $CONFIG_FILE ] && mv $CONFIG_FILE $OPENWRT_PATH/.config
          cd $OPENWRT_PATH
          cp -a $GITHUB_WORKSPACE/scripts/openwrt/* ./

          CLASH_DIR=$OPENWRT_PATH/package/base-files/files/etc/openclash/core
          mkdir -p "$CLASH_DIR"
          curl -fsSL -o $CLASH_DIR/clash.tar.gz https://raw.githubusercontent.com/vernesong/OpenClash/core/dev/meta/clash-linux-arm64.tar.gz
          tar -xzf $CLASH_DIR/clash.tar.gz -C $CLASH_DIR
          rm -f $CLASH_DIR/clash.tar.gz
          mv $CLASH_DIR/clash $CLASH_DIR/clash_meta
          chmod +x $CLASH_DIR/clash_meta
          
          sed -i 's/nas/services/g' feeds/luci/applications/luci-app-samba4/root/usr/share/luci/menu.d/luci-app-samba4.json


      - name: 下载DL包
        run: |
          cd $OPENWRT_PATH
          make defconfig
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译固件
        id: compile
        run: |
          cd $OPENWRT_PATH
          mkdir -p files/etc/uci-defaults
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j$(nproc) V=s
          echo "status=success" >> $GITHUB_OUTPUT
          echo "DATE=$(date +"%Y-%m-%d")" >> $GITHUB_ENV
          echo "FILE_DATE=$(date +"%Y.%m.%d")" >> $GITHUB_ENV

      - name: 检查空间使用情况
        if: (!cancelled())
        run: df -hT

      - name: 整理文件
        if: steps.compile.outputs.status == 'success'
        run: |
          cd $OPENWRT_PATH/bin/targets/*/*
          cp $OPENWRT_PATH/.config build.config
          rm -rf packages feeds.buildinfo version.buildinfo config.buildinfo profiles.json sha256sums
          echo "KERNEL=$(cat *.manifest | grep ^kernel | cut -d- -f2 | tr -d ' ')" >> $GITHUB_ENV
          echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV

      - name: 上传固件到 Release
        if: steps.compile.outputs.status == 'success' && env.FIRMWARE_RELEASE == 'true'
        uses: ncipollo/release-action@main
        with:
          name: ${{ env.DATE }} for ${{ env.FIRMWARE_TAG }}
          allowUpdates: true
          tag: ${{ env.DATE }}-${{ env.FIRMWARE_TAG }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: ${{ env.FIRMWARE_PATH }}/*
          body: |
            **This is OpenWrt Firmware for ${{ env.FIRMWARE_TAG }}**
            ### 📒 固件信息
            - 💻 平台架构: ${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}
            - ⚽ 固件源码: ${{ env.REPO_URL }}
            - 💝 源码分支: ${{ env.REPO_BRANCH }}
            - 🚀 内核版本: ${{ env.KERNEL }}
            ### 🧊 固件版本
            - 主源码更新记录
            - ${{ env.COMMIT_AUTHOR }}
            - ${{ env.COMMIT_DATE }}
            - ${{ env.COMMIT_MESSAGE }}
            - ${{ env.COMMIT_HASH }}
